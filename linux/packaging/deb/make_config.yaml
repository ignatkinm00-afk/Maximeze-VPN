# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting maximeze-vpn.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up Maximeze VPN..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=app.maximeze-vpn.com' "/usr/share/applications/maximeze-vpn.desktop"
  - echo "Search and remove maximeze-vpn.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/maximeze-vpn.desktop" ]; then rm -f "$user_dir/.local/share/applications/maximeze-vpn.desktop"; echo "Found and removed maximeze-vpn.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "Maximeze VPN is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove Maximeze VPN configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing Maximeze VPN user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/maximeze-vpn" ]; then rm -rf "$user_dir/.local/share/maximeze-vpn"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/maximeze-vpn
  - echo "Maximeze VPN data cleanup complete."

