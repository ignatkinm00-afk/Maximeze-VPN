name: Build Maximeze VPN Android APK

on:
  push:
    branches: [ "claude/maximeze-vpn-android-build-a5o37v", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Download hiddify-core Android libs
        run: |
          mkdir -p android/app/libs
          curl -L "https://github.com/hiddify/hiddify-core/releases/download/v4.1.0/hiddify-lib-android.tar.gz" \
            | tar xz -C android/app/libs/
          ls android/app/libs/

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Debug APK
        run: |
          flutter build apk --debug \
            --target-platform android-arm64 \
            --dart-define=app.name="Maximeze VPN"
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358

      - name: List APK output
        run: find build/app/outputs -name "*.apk" | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maximeze-vpn-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error
