name: Build Maximeze VPN

on:
  push:
    branches: [ "claude/maximeze-vpn-android-build-a5o37v", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Download hiddify-core Android libs
        run: |
          mkdir -p android/app/libs
          curl -L "https://github.com/hiddify/hiddify-core/releases/download/v4.1.0/hiddify-lib-android.tar.gz" \
            | tar xz -C android/app/libs/

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Debug APK
        run: |
          flutter build apk --debug \
            --target-platform android-arm64 \
            --dart-define=app.name="Maximeze VPN"
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Maximeze-VPN-android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maximeze-vpn-android-debug
          path: Maximeze-VPN-android-arm64.apk
          retention-days: 30
          if-no-files-found: error

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Download hiddify-core Windows libs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "hiddify-core/bin"
          Invoke-WebRequest -Uri "https://github.com/hiddify/hiddify-core/releases/download/v4.1.0/hiddify-lib-windows-amd64.tar.gz" -OutFile "hiddify-lib-windows.tar.gz"
          tar xzf hiddify-lib-windows.tar.gz -C hiddify-core/bin/

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release --dart-define=app.name="Maximeze VPN"

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Maximeze-VPN-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: maximeze-vpn-windows
          path: Maximeze-VPN-windows-x64.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-build${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Maximeze VPN ${{ steps.version.outputs.version }} (Build ${{ github.run_number }})"
          body: |
            ## Maximeze VPN

            Автоматическая сборка из ветки `${{ github.ref_name }}`

            ### 📥 Скачать
            | Платформа | Файл |
            |-----------|------|
            | 🤖 Android (arm64) | `Maximeze-VPN-android-arm64.apk` |
            | 🪟 Windows (x64) | `Maximeze-VPN-windows-x64.zip` |

            ### Установка Android
            1. Скачай APK
            2. Разреши установку из неизвестных источников
            3. Установи

            ### Установка Windows
            1. Скачай ZIP
            2. Распакуй в любую папку
            3. Запусти `maximeze_vpn.exe`

            ---
            🔨 Build #${{ github.run_number }} • Commit: ${{ github.sha }}
          files: |
            release-files/maximeze-vpn-android-debug/Maximeze-VPN-android-arm64.apk
            release-files/maximeze-vpn-windows/Maximeze-VPN-windows-x64.zip
          draft: false
          prerelease: true
